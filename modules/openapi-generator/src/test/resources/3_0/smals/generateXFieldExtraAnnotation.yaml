openapi: "3.0.2"
info:
  title: "Generate annotations for x-field-extra-annotation extensions"
  version: "1.0"
tags:
  - name: "Pets"
servers:
  - url: https://api.server.test/v1

paths:
  /pets/{petId}:
    get:
      tags:
        - "Pets"
      operationId: "getPet"
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: string
          x-field-extra-annotation: '@be.belgium.gcloud.rest.petstore.annotation.PetId'
      responses:
        '200':
          description: OK
components:
  schemas:
    Pet:
      type: object
      additionalProperties: true
      properties:
        petId:
         $ref: "#/components/schemas/PetId"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/OwnerId"
    PetId:
      type: string
      x-field-extra-annotation: '@be.belgium.gcloud.rest.petstore.annotation.PetId'
    OwnerId:
      type: string
      x-field-extra-annotation: '@be.belgium.gcloud.rest.petstore.annotation.OwnerId'