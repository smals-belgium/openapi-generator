openapi: 3.0.1
info:
  title: Resolve mapped schema reference as parent in AllOf
  version: 0.0.1
components:
  schemas:
    Parent:
      type: object
      properties:
        someParentProperty:
          type: string
    Child:
      allOf:
        - description: reference to internal parent schema
          $ref: "#/components/schemas/Parent"
        - type: object
          properties:
            someTypeProperty:
            type: string
