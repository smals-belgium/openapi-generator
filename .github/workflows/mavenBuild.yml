# Maven CI build for the smals-belgium openapi-generator
name: Maven build and publish snapshot

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: update group id
        uses: ./.github/actions/update-group-id
        with:
          old-group-id: org.openapitools
          new-group-id: io.github.smals-belgium
      - name: update version
        if: ${{ github.event.number != null }}
        run: echo "update version {{github.event.number}}"

      - name: Build and publish with Maven
        run: mvn -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}